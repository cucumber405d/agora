name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      - name: Tag matches __version__
        run: |
          $version = uv run python -c "import ibikus.appa.agora as a; print(a.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != v$version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

      - name: Build exe
        run: uv run pyinstaller packaging/agora.spec --noconfirm
      - name: Smoke test exe
        run: uv run python scripts/smoke.py dist/agora/agora.exe $env:VERSION

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$env:VERSION packaging\agora.iss
      - name: Portable zip
        run: Compress-Archive -Path dist/agora -DestinationPath "dist/Agora-$env:VERSION-portable.zip"

      - name: Changelog
        run: |
          $prev = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $since = git log -1 --format=%as $prev
            uv run python scripts/changelog.py --version $env:VERSION --since $since --out CHANGELOG.md
          } else {
            uv run python scripts/changelog.py --version $env:VERSION --out CHANGELOG.md
          }

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/Agora-Setup-$env:VERSION.exe" "dist/Agora-$env:VERSION-portable.zip"
          --title "Agora $env:VERSION" --notes-file CHANGELOG.md

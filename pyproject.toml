[project]
name = "agora"
version = "0.1.0"
description = "Agora - reflection agent with a Far-style console UI (part of the Appa platform)"
readme = "docs/start.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai,anthropic]>=2.66,<2.67",
    "langgraph>=1.2,<1.3",
    "textual>=8.2,<8.3",
    "langfuse>=5.2,<5.3",
    "pydantic-settings[yaml]>=2.16,<2.17",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyperclip>=1.9",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.3,<0.2",
    "psutil>=6",
]

[project.scripts]
agora = "ibikus.appa.agora.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4,<1.5",
    "pytest-textual-snapshot>=1.1,<1.2",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    "types-PyYAML",
    "types-pyperclip",
    "reportlab>=5.1.0",
    "types-psutil>=7.2.2.20261111",
    "python-docx>=1.2.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibikus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
packages = ["ibikus.appa.agora"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs a real LLM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240", "RUF001"]
